<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מפת הקווים של הדרימליינר</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
:root{--bg:#eef2f8;--fg:#14233a;--mute:#5a6b85;--dot:40 70 120;--arc:20 110 200;--acc:214 96 26;--chip:rgba(20,35,58,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d1b;--fg:#e9eefb;--mute:#8e9cba;--dot:150 185 235;--arc:96 190 255;--acc:255 184 77;--chip:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--bg:#080d1b;--fg:#e9eefb;--mute:#8e9cba;--dot:150 185 235;--arc:96 190 255;--acc:255 184 77;--chip:rgba(255,255,255,.06)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{position:relative;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
header{position:absolute;top:18px;inset-inline:0;text-align:center;pointer-events:none;padding:0 16px}
h1{margin:0;font:700 26px/1.2 "Frank Ruhl Libre",Georgia,serif;letter-spacing:.01em}
#info{margin:8px 0 0;min-height:20px;font-size:14px;color:var(--mute)}
nav{position:absolute;bottom:16px;inset-inline:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 12px}
button{font:500 14px system-ui,sans-serif;color:var(--fg);background:var(--chip);border:1px solid rgb(var(--dot) / .3);border-radius:999px;padding:9px 15px;cursor:pointer}
button:focus-visible{outline:2px solid rgb(var(--acc));outline-offset:2px}
button.on{background:rgb(var(--acc) / .18);border-color:rgb(var(--acc))}
</style>
</head>
<body>
<canvas id="c" aria-label="גלובוס תלת־ממדי עם קווי הטיסה מתל אביב"></canvas>
<header><h1>מפת הקווים של הדרימליינר</h1><p id="info">גרור כדי לסובב, בחר יעד כדי להתמקד בו</p></header>
<nav id="nav"></nav>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),nav=document.getElementById('nav'),info=document.getElementById('info'),hint=info.textContent;
const D=[['JFK','ניו יורק',40.64,-73.78],['MIA','מיאמי',25.79,-80.29],['BOS','בוסטון',42.36,-71.01],['LAX','לוס אנג׳לס',33.94,-118.41],['BKK','בנגקוק',13.69,100.75],['NRT','טוקיו',35.77,140.39]];
const H=['TLV','תל אביב',32.01,34.89],rad=Math.PI/180,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const vec=(la,lo)=>[Math.cos(la*rad)*Math.sin(lo*rad),Math.sin(la*rad),Math.cos(la*rad)*Math.cos(lo*rad)];
const A=vec(H[2],H[3]);
const routes=D.map((d,i)=>{const B=vec(d[2],d[3]),w=Math.acos(Math.min(1,A[0]*B[0]+A[1]*B[1]+A[2]*B[2])),s=Math.sin(w),pts=[];
  for(let k=0;k<=80;k++){const t=k/80,a=Math.sin((1-t)*w)/s,b=Math.sin(t*w)/s,r=1+.13*w*Math.sin(Math.PI*t);pts.push([(a*A[0]+b*B[0])*r,(a*A[1]+b*B[1])*r,(a*A[2]+b*B[2])*r]);}
  return{d,B,pts,o:i/D.length,km:w*6371};});
const dots=[],N=1600;
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=i*2.399963;dots.push([r*Math.sin(th),y,r*Math.cos(th)]);}
let lam=.35,pt=.5,sel=-1,tgt=null,drag=false,px=0,py=0,W,Hh,cx,cy,Rr,col={},fg='';
function size(){const dpr=Math.min(devicePixelRatio||1,2);W=C.clientWidth;Hh=C.clientHeight;C.width=W*dpr;C.height=Hh*dpr;X.setTransform(dpr,0,0,dpr,0,0);X.direction='ltr';X.textAlign='left';cx=W/2;cy=Hh*.47;Rr=Math.min(W*.42,Hh*.34);}
function theme(){const s=getComputedStyle(document.documentElement);for(const k of['dot','arc','acc'])col[k]=s.getPropertyValue('--'+k).trim().split(/\s+/).join(',');fg=s.getPropertyValue('--fg').trim();}
const rgba=(k,a)=>`rgba(${col[k]},${a})`;
function rot(v){const cl=Math.cos(lam),sl=Math.sin(lam),cp=Math.cos(pt),sp=Math.sin(pt),x=v[0]*cl-v[2]*sl,z=v[0]*sl+v[2]*cl;return[x,v[1]*cp-z*sp,v[1]*sp+z*cp];}
const P=v=>{const q=rot(v);return[cx+Rr*q[0],cy-Rr*q[1],q[2],q];};
const vis=q=>q[2]>0||q[0]*q[0]+q[1]*q[1]>1;
const ang=d=>Math.atan2(Math.sin(d),Math.cos(d));
function draw(t){
  X.clearRect(0,0,W,Hh);
  const g=X.createRadialGradient(cx,cy,Rr*.92,cx,cy,Rr*1.4);g.addColorStop(0,rgba('arc',.2));g.addColorStop(1,rgba('arc',0));
  X.fillStyle=g;X.beginPath();X.arc(cx,cy,Rr*1.4,0,7);X.fill();
  X.strokeStyle=rgba('dot',.4);X.lineWidth=1;X.beginPath();X.arc(cx,cy,Rr,0,7);X.stroke();
  for(const v of dots){const q=rot(v);if(q[2]<=0)continue;X.fillStyle=rgba('dot',.1+.55*q[2]);X.fillRect(cx+Rr*q[0]-.8,cy-Rr*q[1]-.8,1.6,1.6);}
  routes.forEach((r,i)=>{
    const on=i===sel,hi=((t/9000+r.o)%1)*80,P2=r.pts.map(P);
    X.lineWidth=on?2:1;X.strokeStyle=rgba(on?'acc':'arc',on?.75:.3);X.beginPath();
    let pen=false;P2.forEach(p=>{if(vis(p[3])){pen?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]);pen=true}else pen=false});X.stroke();
    const f=Math.floor(hi);
    for(let k=Math.max(1,f-18);k<=f;k++){const a=P2[k-1],b=P2[k];if(!vis(a[3])||!vis(b[3]))continue;
      X.strokeStyle=rgba('acc',(1-(hi-k)/18)*.9);X.lineWidth=2.2;X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke();}
    const h=P2[f];if(vis(h[3])){X.fillStyle=rgba('acc',1);X.shadowColor=rgba('acc',1);X.shadowBlur=12;X.beginPath();X.arc(h[0],h[1],3,0,7);X.fill();X.shadowBlur=0;}
  });
  [[H,A,1],...routes.map(r=>[r.d,r.B,0])].forEach(([c,v,home],i)=>{
    const p=P(v);if(p[2]<=0)return;
    const pl=(t/1400+i*.31)%1;
    X.strokeStyle=rgba('acc',(1-pl)*.6);X.lineWidth=1.2;X.beginPath();X.arc(p[0],p[1],3+pl*(home?18:11),0,7);X.stroke();
    X.fillStyle=rgba('acc',1);X.beginPath();X.arc(p[0],p[1],home?4.5:3.2,0,7);X.fill();
    X.globalAlpha=Math.min(1,p[2]*2.5);X.fillStyle=fg;X.font=`600 ${home?13:11}px system-ui,sans-serif`;X.fillText(c[0],p[0]+9,p[1]-8);X.globalAlpha=1;
  });
}
let last=0;
function frame(t){
  const dt=t-last;last=t;
  if(tgt){lam+=ang(tgt.l-lam)*.06;pt+=(tgt.p-pt)*.06;}
  else if(!drag&&sel<0&&!calm)lam+=dt*.00012;
  draw(t);requestAnimationFrame(frame);
}
function pick(i){
  sel=sel===i?-1:i;
  nav.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===sel));
  if(sel<0){tgt=null;info.textContent=hint;return;}
  const r=routes[sel],m=[A[0]+r.B[0],A[1]+r.B[1],A[2]+r.B[2]];
  tgt={l:Math.atan2(m[0],m[2]),p:Math.atan2(m[1],Math.hypot(m[0],m[2]))*.9};
  info.textContent=`${r.d[1]} · ${Math.round(r.km).toLocaleString('he-IL')} ק״מ בקו ישר · כ־${Math.round(r.km/880+.5)} שעות טיסה (הערכה)`;
}
D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d[1]+' · '+d[0];b.onclick=()=>pick(i);nav.append(b);});
C.addEventListener('pointerdown',e=>{drag=true;tgt=null;px=e.clientX;py=e.clientY;C.setPointerCapture(e.pointerId);C.style.cursor='grabbing';});
C.addEventListener('pointermove',e=>{if(!drag)return;lam-=(e.clientX-px)/Rr;pt=Math.max(-1.2,Math.min(1.2,pt+(e.clientY-py)/Rr));px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>{drag=false;C.style.cursor='grab';});
addEventListener('resize',size);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
size();theme();requestAnimationFrame(frame);
</script>
</body>
</html>
